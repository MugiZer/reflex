name: T4 test and collection run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to test
        required: true
        default: main
      seeds:
        description: Comma-separated collection seeds
        required: true
        default: "11,17,23"
      iters:
        description: GPU workload iterations per case
        required: true
        default: "20"

permissions:
  contents: write

jobs:
  t4:
    # Default labels target a self-hosted Linux T4 runner. Set the repository
    # variable REFLEX_T4_RUNNER to a JSON label array for a hosted GPU runner.
    runs-on: ${{ fromJSON(vars.REFLEX_T4_RUNNER || '["self-hosted","linux","x64","gpu"]') }}
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pytest mapie
          python -c "import torch" || python -m pip install torch

      - name: Verify CUDA runtime
        run: |
          nvidia-smi
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA is unavailable'; print(torch.cuda.get_device_name(0))"

      - name: Run full tests and T4 collection
        continue-on-error: true
        env:
          REFLEX_REF: ${{ inputs.ref }}
          REFLEX_SEEDS: ${{ inputs.seeds }}
          REFLEX_ITERS: ${{ inputs.iters }}
        run: python scripts/t4_run.py --seeds "${REFLEX_SEEDS}" --iters "${REFLEX_ITERS}"

      - name: Upload raw logs and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflex-t4-${{ github.run_id }}
          path: /tmp/reflex_runs
          if-no-files-found: warn
          retention-days: 30

      - name: Publish result to GitHub
        if: always()
        env:
          REFLEX_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/reflex_runs/run_result.json ]; then
            python -c "import json; from pathlib import Path; from colab.report_results import publish; p=Path('/tmp/reflex_runs/run_result.json'); publish(json.loads(p.read_text()), p)"
          else
            echo "t4_run.py did not produce run_result.json"
          fi

      - name: Fail workflow when the recorded run failed
        if: always()
        run: |
          python -c "import json, pathlib, sys; result=json.loads(pathlib.Path('/tmp/reflex_runs/run_result.json').read_text()); print(result['status']); sys.exit(result['status'] != 'passed')"
