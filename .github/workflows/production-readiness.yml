name: Production readiness

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:production-readiness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readiness-evidence
          path: .scratch/production-readiness-checkup/evidence/
          if-no-files-found: warn
