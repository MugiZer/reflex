name: Record Colab test result

on:
  repository_dispatch:
    types: [colab-test-result]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure results branch exists
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          git fetch origin main colab-results || true
          git show-ref --verify --quiet refs/remotes/origin/colab-results || git push origin "origin/main:refs/heads/colab-results"
      - name: Record result on colab-results
        uses: actions/github-script@v7
        with:
          script: |
            const result = context.payload.client_payload;
            if (!result || !result.run_id || !result.commit) {
              core.setFailed('Payload must contain run_id and commit');
              return;
            }

            const path = `runs/${result.run_id}.json`;
            const content = Buffer.from(JSON.stringify(result, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'colab-results',
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `Record Colab run ${result.run_id}`,
              content,
              branch: 'colab-results',
              ...(sha ? { sha } : {}),
            });

            core.summary
              .addHeading(`Colab ${result.status}: ${result.run_id}`)
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Commit', result.commit],
                ['GPU', result.hardware || 'unknown'],
                ['Pytest exit code', String(result.pytest_exit_code)],
              ])
              .write();
